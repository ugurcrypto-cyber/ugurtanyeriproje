{% extends "base.html" %}
{% block baslik %}Üye ol{% endblock %}
{% block icerik %}
<div class="kart" style="max-width:420px;margin:0 auto">
  <h1>Üye ol</h1>
  <form method="post" action="{{ url_for('kayit') }}">{{ csrf_input() }}
    <label for="ad">Ad soyad</label><input id="ad" type="text" name="ad" maxlength="80" required autofocus>
    <label for="eposta">E-posta</label><input id="eposta" type="email" name="eposta" maxlength="120" required>
    <label for="sifre">Şifre (en az 8 karakter)</label><input id="sifre" type="password" name="sifre" minlength="8" required>
    <p><button type="submit">Kayıt ol</button></p>
  </form>
  <p class="ince">Kayıttan sonra üyeliğiniz yönetici tarafından aktif edilir. Aktif edilene kadar proje yükleyemezsiniz.</p>
</div>
{% endblock %}
